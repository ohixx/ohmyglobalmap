<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta property="og:title" content="OhMyGlobalMap — карта сервера">
  <meta property="og:description" content="глобалленс. айтек. победа">
  <meta property="og:type" content="website">
  <meta name="description" content="глобалленс. айтек. победа">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OhMyGlobalMap — карта сервера</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d97757'/%3E%3Cpath d='M4 16h24M16 3c5 5 5 21 0 26M16 3c-5 5-5 21 0 26' fill='none' stroke='%23faf9f5' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css?v=20261015d">
  <link rel="stylesheet" href="css/style.css?v=20261015d">
</head>
<body data-theme="dark" data-style="dark">
  <div id="map" aria-label="Карта мира"></div>
  <div id="wm" class="wm" aria-hidden="true">ohixxx</div>

  <aside id="panel" class="panel">
    <header class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 16h24M16 4c4.5 4.5 4.5 19.500 0 24M16 4c-4.5 4.5-4.5 19.500 0 24" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <h1>OhMyGlobalMap</h1>
      <button id="addSideBtn" class="add" title="Добавить сторону" aria-label="Добавить сторону">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="panelFold" class="fold" title="Свернуть вниз" aria-label="Свернуть панель">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <form id="sideForm" class="side-form" hidden autocomplete="off">
      <input id="sideName" type="text" placeholder="Название стороны" maxlength="40" required>
      <div id="swatches" class="swatches"></div>
      <div class="row">
        <button type="submit" class="btn primary">Создать</button>
        <button type="button" id="cancelSide" class="btn">Отмена</button>
      </div>
    </form>

    <div id="sides" class="sides"></div>

    <div id="empty" class="empty">
      <p>Нажми <b>+</b>, создай сторону и добавь в неё страны. Территории передаются рисованием от руки.</p>
    </div>

    <footer class="foot">
      <button id="undoBtn" class="btn small" title="Отменить (Ctrl+Z)">Отменить</button>
      <button id="exportBtn" class="btn small">Экспорт</button>
      <button id="importBtn" class="btn small">Импорт</button>
      <button id="resetBtn" class="btn small danger">Сброс</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </footer>
  </aside>

  <button id="panelToggle" class="panel-toggle" aria-label="Меню">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div id="topbar" class="topbar">
    <div id="styleBar" class="seg" role="group" aria-label="Стиль карты"></div>
    <div class="row-tools">
      <div id="fillBar" class="seg" role="group" aria-label="Вид стран"></div>
      <button id="citiesBtn" class="tool" title="Города"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l5-3v15M8 21V4l7 3v14M15 21V11l6 2v8M3 21h18"/></svg><span>Города</span></button>
      <button id="cleanBtn" class="tool" title="Скрыть интерфейс (H)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div id="cityPop" class="citypop" hidden>
      <label class="sw"><input type="checkbox" id="cShow"><span>Показывать города</span></label>
      <label class="sw"><input type="checkbox" id="cLabels"><span>Подписи</span></label>
      <label class="sw"><input type="checkbox" id="cCaps"><span>Только столицы</span></label>
      <label class="rg"><span>Количество</span><input type="range" id="cDensity" min="0" max="100"></label>
      <label class="rg"><span>Размер</span><input type="range" id="cSize" min="60" max="160"></label>
    </div>
  </div>

  <button id="cleanBack" class="clean-back" title="Показать интерфейс (H)" aria-label="Показать интерфейс" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <div id="banner" class="banner" hidden>
    <div id="bannerText" class="banner-text"></div>
    <div id="bannerTools" class="banner-tools"></div>
  </div>

  <div id="timeline" class="timeline">
    <button id="eraPrev" class="step" aria-label="Раньше">‹</button>
    <div class="tl-mid">
      <div class="tl-top">
        <input id="eraYear" class="era-year" value="2026" aria-label="Год" spellcheck="false" autocomplete="off" title="Введи год и нажми Enter">
        <span id="eraNote" class="era-note"></span>
      </div>
      <input id="eraRange" type="range" min="0" max="0" step="1" value="0" aria-label="Год">
    </div>
    <button id="eraNext" class="step" aria-label="Позже">›</button>
    <button id="tlFold" class="fold tl-fold" title="Свернуть вниз" aria-label="Свернуть шкалу">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet.js?v=20261015d"></script>
  <script src="vendor/polygon-clipping.umd.min.js?v=20261015d"></script>
  <script src="vendor/topojson-client.min.js?v=20261015d"></script>
  <script src="js/app.js?v=20261015d"></script>
</body>
</html>
