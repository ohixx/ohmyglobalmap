<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OhMyGlobalMap — карта сервера</title>
  <meta name="description" content="Интерактивная карта для ВПИ-сервера: стороны, страны и редактируемые границы.">
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2318233a' stroke='%236ea8ff' stroke-width='2'/%3E%3Cpath d='M6 16h20M16 4c5 4 5 20 0 24M16 4c-5 4-5 20 0 24' fill='none' stroke='%236ea8ff' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/leaflet-geoman.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Карта мира"></div>

  <aside id="panel" class="panel">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 16h26M16 3c5 4 5 22 0 26M16 3c-5 4-5 22 0 26" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>
      <div>
        <h1>OhMyGlobalMap</h1>
        <p>Карта вашего сервера</p>
      </div>
    </header>

    <div class="sides-head">
      <h2>Стороны</h2>
      <button id="addSideBtn" class="fab" title="Добавить сторону" aria-label="Добавить сторону">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="sideForm" class="side-form" hidden autocomplete="off">
      <input id="sideName" type="text" placeholder="Название стороны" maxlength="40" required>
      <div id="swatches" class="swatches"></div>
      <div class="row">
        <button type="submit" class="btn primary">Создать</button>
        <button type="button" id="cancelSide" class="btn ghost">Отмена</button>
      </div>
    </form>

    <div id="sides" class="sides"></div>

    <div id="empty" class="empty">
      <div class="empty-art">🌍</div>
      <p>Нажми <b>+</b>, создай сторону и добавь в неё страны. Границы можно двигать, перерисовывать и вырезать.</p>
    </div>

    <footer class="foot">
      <button id="exportBtn" class="btn ghost small">Экспорт</button>
      <button id="importBtn" class="btn ghost small">Импорт</button>
      <button id="resetBtn" class="btn ghost small danger">Сбросить</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </footer>
  </aside>

  <button id="panelToggle" class="panel-toggle" aria-label="Меню">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span>
    <div class="banner-actions" id="bannerActions"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet-geoman.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
